:concurrency: 5
:queues:
  - [mailers, 2]
  - [default, 1]
  - [reconciliation, 1]
  - [active_storage_analysis, 1]
  - [active_storage_purge, 1]

# Cron schedules — sidekiq-cron gem required (added to Gemfile)
:schedule:
  reconcile_pending_payments:
    cron: "*/5 * * * *"   # every 5 minutes
    class: ReconcilePendingPaymentsJob
    queue: reconciliation
    description: "Poll Jenga for stuck pending PaymentTransactions and resolve them"